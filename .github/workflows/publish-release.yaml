name: Publish Windows release

on:
  push:
    tags:
      - "honnavar-v*.*.*"
      - "kasarkod-v*.*.*"
  workflow_dispatch:
    inputs:
      tenant:
        description: "Tenant release channel"
        required: true
        type: choice
        options:
          - honnavar
          - kasarkod
      version:
        description: "Release version (must match pom.xml, for example 1.2.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    env:
      RELEASE_REPOSITORY: ${{ vars.RELEASE_REPOSITORY }}
      GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
    steps:
      - name: Check out application source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download matching JavaFX Windows JMODs
        id: javafx
        shell: pwsh
        run: |
          $javafxVersion = "17.0.18"
          $archive = "openjfx-$javafxVersion`_windows-x64_bin-jmods.zip"
          $url = "https://download2.gluonhq.com/openjfx/$javafxVersion/$archive"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath javafx-jmods
          $jmods = Get-ChildItem javafx-jmods -Directory -Filter "javafx-jmods-*" | Select-Object -First 1
          if ($null -eq $jmods) {
            throw "The JavaFX JMOD archive did not contain a javafx-jmods directory."
          }
          "path=$($jmods.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Ensure WiX tools are available for MSI packaging
        shell: pwsh
        run: |
          $wixBin = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v*" -Directory -ErrorAction SilentlyContinue |
            ForEach-Object { Join-Path $_.FullName "bin" } |
            Where-Object { Test-Path (Join-Path $_ "candle.exe") } |
            Select-Object -First 1
          if ($null -eq $wixBin) {
            choco install wixtoolset --yes --no-progress
            $wixBin = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v*" -Directory |
              ForEach-Object { Join-Path $_.FullName "bin" } |
              Where-Object { Test-Path (Join-Path $_ "candle.exe") } |
              Select-Object -First 1
          }
          if ($null -eq $wixBin) {
            throw "WiX candle.exe was not found after installation."
          }
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Validate release configuration
        id: release
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_REPOSITORY)) {
            throw "Set the RELEASE_REPOSITORY Actions variable to owner/BoatBookingSystemReleases."
          }
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw "Set the RELEASE_REPO_TOKEN Actions secret with Contents read/write access to the release repository."
          }

          [xml]$pom = Get-Content -Raw pom.xml
          $namespaceManager = New-Object System.Xml.XmlNamespaceManager($pom.NameTable)
          $namespaceManager.AddNamespace("m", "http://maven.apache.org/POM/4.0.0")
          $projectVersion = $pom.SelectSingleNode("/m:project/m:version", $namespaceManager).InnerText.Trim()
          if ("${{ github.event_name }}" -eq "push") {
            if ("${{ github.ref_name }}" -notmatch "^(honnavar|kasarkod)-v(\d+\.\d+\.\d+)$") {
              throw "Release tags must be honnavar-vMAJOR.MINOR.PATCH or kasarkod-vMAJOR.MINOR.PATCH."
            }
            $tenant = $Matches[1]
            $releaseVersion = $Matches[2]
          } else {
            $tenant = "${{ inputs.tenant }}"
            $releaseVersion = "${{ inputs.version }}"
          }
          if ($projectVersion -ne $releaseVersion) {
            throw "Release version '$releaseVersion' must match pom.xml version '$projectVersion'."
          }
          switch ($tenant) {
            "honnavar" {
              $artifactName = "HonnavarBoatTicketSystem"
              $tenantDisplayName = "Honnavar"
              $upgradeUuid = "616ff3db-c1ac-4a4c-ac3a-7a75bfd55c75"
            }
            "kasarkod" {
              $artifactName = "KasarkodBoatTicketSystem"
              $tenantDisplayName = "Kasarkod"
              $upgradeUuid = "a1c94d17-c50f-4a8b-a419-7b7bb6e30913"
            }
            default { throw "Unknown tenant '$tenant'." }
          }
          "version=$releaseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tenant=$tenant" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "artifactName=$artifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tenantDisplayName=$tenantDisplayName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "upgradeUuid=$upgradeUuid" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Verify and build application JAR
        shell: pwsh
        run: |
          mvn -B -V -q com.diffplug.spotless:spotless-maven-plugin:2.31.0:check
          mvn -B -V -q clean verify -P${{ steps.release.outputs.tenant }}

      - name: Determine the runtime modules required by the application
        id: runtime
        shell: pwsh
        run: |
          $jar = "target/${{ steps.release.outputs.artifactName }}.jar"
          $runtimeModules = (& jdeps `
            --ignore-missing-deps `
            --multi-release 17 `
            --print-module-deps `
            --module-path "${{ steps.javafx.outputs.path }}" `
            $jar).Trim()
          if ([string]::IsNullOrWhiteSpace($runtimeModules)) {
            throw "jdeps did not identify any modules for the application runtime."
          }
          # GitHub's HTTPS endpoint commonly negotiates an elliptic-curve cipher suite. jdeps
          # cannot always infer this service-provider module, so include it explicitly.
          $runtimeModules = (@($runtimeModules -split ","; "jdk.crypto.ec") |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
            Sort-Object -Unique) -join ","
          "modules=$runtimeModules" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build Windows MSI installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          jpackage `
            --type msi `
            --name "BoatBookingSystem-${{ steps.release.outputs.tenantDisplayName }}" `
            --app-version "${{ steps.release.outputs.version }}" `
            --vendor "Codenitros" `
            --description "Sharavati Backwater Boating ${{ steps.release.outputs.tenantDisplayName }} Ticket Booking" `
            --input target `
            --main-jar ${{ steps.release.outputs.artifactName }}.jar `
            --main-class com.boatticket.ApplicationLauncher `
            --module-path "$env:JAVA_HOME\jmods;${{ steps.javafx.outputs.path }}" `
            --add-modules "${{ steps.runtime.outputs.modules }}" `
            --java-options "--add-modules=${{ steps.runtime.outputs.modules }}" `
            --icon src/main/resources/BoatBookingSystem.ico `
            --resource-dir src/main/installer/windows `
            --dest dist `
            --win-dir-chooser `
            --win-console `
            --win-menu `
            --win-menu-group "Boat Booking System - ${{ steps.release.outputs.tenantDisplayName }}" `
            --win-shortcut `
            --win-shortcut-prompt `
            --win-upgrade-uuid ${{ steps.release.outputs.upgradeUuid }}

      - name: Check out public release repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.RELEASE_REPOSITORY }}
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          path: release-repository

      - name: Publish installer and update manifest
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter *.msi | Select-Object -First 1
          if ($null -eq $installer) {
            throw "MSI installer was not produced."
          }
          $version = "${{ steps.release.outputs.version }}"
          $tenant = "${{ steps.release.outputs.tenant }}"
          $tenantDisplayName = "${{ steps.release.outputs.tenantDisplayName }}"
          $releaseTag = "$tenant-v$version"
          gh release create $releaseTag $installer.FullName --repo $env:RELEASE_REPOSITORY --title "$tenantDisplayName Boat Booking System $version" --generate-notes

          $sha256 = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version = $version
            publishedAt = (Get-Date).ToUniversalTime().ToString("o")
            installerUrl = "https://github.com/$env:RELEASE_REPOSITORY/releases/download/$releaseTag/$($installer.Name)"
            sha256 = $sha256
          } | ConvertTo-Json
          New-Item -ItemType Directory -Force -Path "release-repository\metadata\$tenant" | Out-Null
          Set-Content -Path "release-repository\metadata\$tenant\stable.json" -Value $manifest -NoNewline

          Set-Location release-repository
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "metadata/$tenant/stable.json"
          git commit -m "Publish $tenant release $version"
          git push
