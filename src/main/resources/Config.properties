# Boat Booking System - Application Configuration
#
# ONE file for everything that used to be split across Price.properties
# and App.properties. On first run, this bundled default is copied to
# the external, user-editable location:
#   <user home>/BoatTicketSystem/Config.properties
#
# To change ANY setting below after deployment, edit the VALUES in that
# external copy (NOT this bundled file) and restart the app -- no code
# changes or rebuilding required.

# ----------------------------------------------------------------------
# TICKET PRICES
# ----------------------------------------------------------------------
boat.ride.fee.per.hour=1500
boat.ride.fee.2hours=2500
life.jacket.fee=10
parking.fee.car=20
parking.fee.bus=50
parking.fee.tempotraveller=40

# ----------------------------------------------------------------------
# DEVELOPER / TESTING TOGGLE
# ----------------------------------------------------------------------
# dev.mode=true  -> every ticket also generates a reference PDF alongside
#                    the thermal print (saved to Downloads/BoatTickets,
#                    never auto-opened). Use this while developing/testing.
# dev.mode=false -> ONLY the thermal printer receives the ticket. No PDF
#                    is generated or saved. Use this at the real deployed
#                    ticket counter.
#
# IMPORTANT: This MUST be false before handing the app off to the
# client, so no PDF ever gets created on their system.
dev.mode=false

# ----------------------------------------------------------------------
# PRINTER
# ----------------------------------------------------------------------
# printer.name= (leave blank to use whatever Windows currently has set
# as its default printer)
#
# Set this to the EXACT name of the thermal/receipt printer, as shown
# in Windows Settings > Bluetooth & devices > Printers & scanners, e.g.:
#   printer.name=POS-80 Series
#
# Recommended for the deployed ticket counter: pin the printer name
# here so tickets always go to the correct physical printer no matter
# what the Windows default printer is set to. If left blank, the app
# uses the system default printer, but will refuse to print to a known
# virtual/PDF printer (e.g. "Microsoft Print to PDF") rather than
# silently generating a file.
printer.name=