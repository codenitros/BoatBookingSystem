# Kasarkod Boat Booking System - Application Configuration
# This tenant-specific default is copied to:
#   <user home>/BoatTicketSystem/kasarkod/Config.properties

# ----------------------------------------------------------------------
# TENANT BRANDING AND UPDATE CHANNEL
# ----------------------------------------------------------------------
tenant.id=kasarkod
tenant.name=Kasarkod
brand.name=Sharavati Backwater Boating
receipt.header=SHARAVATI BACKWATER BOATING
receipt.location=KASARKOD
update.manifest.url=https://raw.githubusercontent.com/codenitros/BoatBookingSystemReleases/main/metadata/kasarkod/stable.json

# ----------------------------------------------------------------------
# TICKET PRICES
# ----------------------------------------------------------------------
boat.ride.fee.per.hour=1500
boat.ride.fee.2hours=2500
life.jacket.fee=10
parking.fee.car=20
parking.fee.bus=50
parking.fee.tempotraveller=40

# ----------------------------------------------------------------------
# DEVELOPER / TESTING TOGGLE
# ----------------------------------------------------------------------
dev.mode=False

# ----------------------------------------------------------------------
# PRINTER
# ----------------------------------------------------------------------
printer.name=
# TVSE RP4230, 80 mm paper, 203 dpi, with a 10 mm horizontal offset.
# Usable content width = 80 mm - 10 mm = 70 mm = 560 dots. Raw ESC/POS
# bypasses the Windows setting, so the 10 mm left margin is sent explicitly.
printer.left.margin.dots=80
printer.width.dots=560
printer.characters.per.line=35

# ----------------------------------------------------------------------
# UPDATE NETWORK TIMEOUT
# ----------------------------------------------------------------------
update.connection.timeout.seconds=30
